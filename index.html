function audio() {
  const AC = window.AudioContext || window.webkitAudioContext;
  if (!AC) return null;
  if (!actx) actx = new AC();
  if (actx.state === 'suspended') actx.resume();
  return actx;
}
function tone(freq, dur, type, gain, slide, delay) {
  try {
    const a = audio();
    if (!a || !(gain > 0) || !(dur > 0)) return;
    const t = a.currentTime + (delay || 0);
    const o = a.createOscillator();
    const g = a.createGain();
    o.type = type || 'sine';
    o.frequency.setValueAtTime(Math.max(40, freq), t);
    if (slide > 0) o.frequency.exponentialRampToValueAtTime(Math.max(40, slide), t + dur);
    g.gain.setValueAtTime(gain, t);
    g.gain.exponentialRampToValueAtTime(0.001, t + dur);
    o.connect(g); g.connect(a.destination);
    o.start(t); o.stop(t + dur + 0.02);
  } catch (e) {}
}
function burst(dur, gain, freq) {
  try {
    const a = audio();
    if (!a || !(gain > 0) || !(dur > 0)) return;
    if (!noiseBuf) {
      noiseBuf = a.createBuffer(1, Math.floor(a.sampleRate * 0.25), a.sampleRate);
      const d = noiseBuf.getChannelData(0);
      for (let i = 0; i < d.length; i++) d[i] = Math.random() * 2 - 1;
    }
    const src = a.createBufferSource();
    src.buffer = noiseBuf;
    const f = a.createBiquadFilter();
    f.type = 'bandpass';
    f.frequency.value = freq || 900;
    f.Q.value = 0.7;
    const g = a.createGain();
    const t = a.currentTime;
    g.gain.setValueAtTime(gain, t);
    g.gain.exponentialRampToValueAtTime(0.001, t + dur);
    src.connect(f); f.connect(g); g.connect(a.destination);
    src.start(t); src.stop(t + dur + 0.02);
  } catch (e) {}
}

function pad(freq, dur, gain, delay) {
  try {
    const a = audio();
    if (!a || !(gain > 0) || !(dur > 0.2)) return;
    const t = a.currentTime + (delay || 0);
    const o = a.createOscillator();
    const g = a.createGain();
    o.type = 'sine';
    o.frequency.value = Math.max(40, freq);
    g.gain.setValueAtTime(0.0001, t);
    g.gain.exponentialRampToValueAtTime(gain, t + 0.9);
    g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
    o.connect(g); g.connect(a.destination);
    o.start(t); o.stop(t + dur + 0.05);
  } catch (e) {}
}
function stopMusic() {
  for (const n of music.nodes) { try { n.stop(); } catch (e) {} }
  music.nodes = [];
  music.mode = '';
}
function toggleSound() {
  if (sound) sfx('ui');
  sound = !sound;
  localStorage.setItem('ground-sound', sound ? '1' : '0');
  if (!sound) stopMusic();
}
function tickMusic() {
  if (!sound || !actx || actx.state !== 'running') {
    if (music.mode) stopMusic();
    return;
  }
  const mode = S.screen === 'battle' ? 'battle' : 'menu';
  if (music.mode !== mode) {
    stopMusic();
    music.mode = mode;
    music.step = 0;
    music.next = actx.currentTime + 0.06;
    const root = mode === 'battle' ? 49 : 55;
    for (const [freq, gain] of [[root, 0.02], [root * 1.5, 0.008]]) {
      const o = actx.createOscillator();
      const g = actx.createGain();
      o.type = 'sine';
      o.frequency.value = freq;
      g.gain.value = gain;
      o.connect(g); g.connect(actx.destination);
      o.start();
      music.nodes.push(o);
    }
  }
  const now = actx.currentTime;
  if (music.next < now - 0.2) music.next = now;
  const phrase = BED[mode];
  const gap = mode === 'battle' ? 3.4 : 4.6;
  const dur = mode === 'battle' ? 5.2 : 6.8;
  while (music.next < now + 0.4) {
    const delay = Math.max(0, music.next - now);
    const f = phrase[music.step % phrase.length];
    pad(f, dur, 0.018, delay);
    pad(f * 2, dur, 0.006, delay);
    music.step++;
    music.next += gap;
  }
}

async function loadAccount() {

function drawDiamond(x, y, r) {
  ctx.beginPath();
  ctx.moveTo(x, y - r);
  ctx.lineTo(x + r * 0.72, y);
  ctx.lineTo(x, y + r);
  ctx.lineTo(x - r * 0.72, y);
  ctx.closePath();
  ctx.fill();
}
function drawObjectives(cam) {

    ctx.fillStyle = '#e23b3b';

    for (const g of game.loose || []) {
      const p = w2s(g.x, g.y, cam);
      ctx.fillStyle = '#e23b3b';
      drawDiamond(p.x, p.y, 8);
    }
  } else if (game.mode === 'ball') {
    for (const hoop of HOOPS) {
      const rim = w2s(hoop.x, hoop.y, cam);
      const lipL = w2s(hoop.x - RIM_HALF, hoop.y, cam);
      const lipR = w2s(hoop.x + RIM_HALF, hoop.y, cam);
      const top = w2s(hoop.x + hoop.side * 0.15, hoop.y + 2.3, cam);
      const net = w2s(hoop.x, hoop.y - 0.7, cam);
      ctx.fillStyle = '#d0d4dc';
      ctx.fillRect(top.x - 3, top.y, 6, rim.y - top.y);

      ctx.strokeStyle = mine && hoop.team === mine.team ? '#e23b3b' : '#8d8a82';
      ctx.lineWidth = 3;
      ctx.beginPath();
      ctx.moveTo(lipL.x, lipL.y);
      ctx.lineTo(lipR.x, lipR.y);
      ctx.stroke();
      ctx.strokeStyle = 'rgba(236,234,228,.45)';
      ctx.lineWidth = 1;
      for (let i = -2; i <= 2; i++) {
        const a = w2s(hoop.x + i * RIM_HALF * 0.4, hoop.y, cam);
        const c = w2s(hoop.x + i * RIM_HALF * 0.22, hoop.y - 0.7, cam);
        ctx.beginPath();
        ctx.moveTo(a.x, a.y);
        ctx.lineTo(c.x, c.y);
        ctx.stroke();
      }
      ctx.beginPath();
      ctx.moveTo(lipL.x, lipL.y);
      ctx.lineTo(net.x - (lipR.x - lipL.x) * 0.22, net.y);
      ctx.lineTo(net.x + (lipR.x - lipL.x) * 0.22, net.y);
      ctx.lineTo(lipR.x, lipR.y);

    if (game.ball) {

      ctx.arc(p.x, p.y, 9, 0, Math.PI * 2);

function drawBossTell(cam) {
  if (!game || game.mode !== 'boss') return;
  for (const b of bosses) {
    if (b.dead || !(b.tellT > 0)) continue;
    const col = b.color || '#eceae4';
    const pulse = 0.55 + 0.45 * Math.abs(Math.sin(T * 16));
    ctx.save();
    ctx.fillStyle = col;
    ctx.strokeStyle = col;
    ctx.lineWidth = 2;
    ctx.lineCap = 'round';
    const hx = CXx(b) + (b.facing || 1) * 0.7;
    const hy = b.y + b.h * 0.45;
    const disc = (x, y, r) => {
      const p = w2s(x, y, cam);
      const rad = r * cam.z * (0.84 + 0.16 * pulse);
      ctx.globalAlpha = 0.2 + 0.12 * pulse;
      ctx.beginPath(); ctx.arc(p.x, p.y, rad, 0, 7); ctx.fill();
      ctx.globalAlpha = 0.95;
      ctx.lineWidth = 3;
      ctx.beginPath(); ctx.arc(p.x, p.y, rad, 0, 7); ctx.stroke();
      ctx.globalAlpha = 0.55;
      ctx.lineWidth = 1.5;
      ctx.beginPath(); ctx.arc(p.x, p.y, rad * 0.62, 0, 7); ctx.stroke();
    };
    if (b.tell === 'flop') disc(hx, b.y + 0.3, 2.3);
    else if (b.tell === 'cleave') disc(hx, hy, 1.9);
    else if (b.tell === 'poke') disc(hx, hy, 1.35);
    else if (b.tell === 'sweep') disc(hx, hy, 2.5);
    else if (b.tell === 'rush' || b.tell === 'lance') {
      const a = w2s(CXx(b), hy, cam);
      const c = w2s(CXx(b) + b.facing * (b.chargeLeft || 4), hy, cam);
      ctx.globalAlpha = 0.35;
      ctx.lineWidth = 14;
      ctx.beginPath(); ctx.moveTo(a.x, a.y); ctx.lineTo(c.x, c.y); ctx.stroke();
      ctx.globalAlpha = 0.9;
      ctx.lineWidth = 2;
      ctx.beginPath(); ctx.arc(c.x, c.y, 16, 0, 7); ctx.stroke();
    } else if (b.tell === 'blink') disc(b.markX + b.w * 0.5, b.markY + b.h * 0.45, 1.05);
    else {
      const ox = CXx(b) + b.facing * 0.5;
      const oy = b.y + b.h * 0.55;
      const spread = b.tell === 'spit' ? [-0.45, 0, 0.45] : b.tell === 'shade' ? [-0.18, 0.18] : [0];
      const len = b.tell === 'spear' ? 4.6 : 3.2;
      ctx.globalAlpha = 0.85;
      ctx.lineWidth = b.tell === 'spear' ? 2 : 4;
      for (let i = 0; i < spread.length; i++) {
        const a = (b.aimA || 0) + spread[i];
        const p = w2s(ox, oy, cam);
        const q = w2s(ox + Math.cos(a) * len, oy + Math.sin(a) * len, cam);
        ctx.beginPath(); ctx.moveTo(p.x, p.y); ctx.lineTo(q.x, q.y); ctx.stroke();
      }
    }
    ctx.restore();
  }
}

function renderBattle() {

    const p = w2s(z.x, z.y, cam);

      ctx.moveTo(p.x, p.y);

    ctx.stroke();
    ctx.globalAlpha = 1;

  drawBossTell(cam);

    }
  }

  nums.forEach(n => { n.y += (n.vy || 0) * dt; n.life -= dt; });
  nums = nums.filter(n => n.life > 0);
  tickSums(dt);
}
function frameBattle(dt) {
  showName(false);
  if (document.activeElement === nameEl) nameEl.blur();
  if (net.role === 'guest') {
    predict(dt);
    renderBattle();
    return;
  }
  if (!S.pause && !(game && game.over)) simulate(dt);
  else {
    fx.forEach(f => f.life -= dt);
  }
  renderBattle();
}

function loop(now) {
  requestAnimationFrame(loop);
  const dt = Math.min(0.033, (now - (loop.t || now)) / 1000) || 0.016;
  loop.t = now;
  hits = [];
  watchGuestTaps();
  ctx.clearRect(0, 0, W, H);
  if (S.screen === 'title') T += dt;
  if (S.screen === 'battle' && game) frameBattle(dt);
  else frameMenu();
  uiClick();
  if (net.role === 'host' && S.screen === 'battle') pumpPublish();
  if (S.screen === 'queue') { net.acc += dt; if (net.acc > 0.7) { net.acc = 0; pollQueue(); } }
  if ((S.screen === 'pvp' || S.screen === 'qmode' || S.screen === 'join') && fb.state !== 'ok' && fb.state !== 'denied') {
    if (!net.pingAt || now - net.pingAt > 2000) { net.pingAt = now; pingFB(); }
  }
  if ((S.screen === 'lobby' || (S.screen === 'battle' && net.role)) && net.code) {
    net.inAcc += dt;
    const step = S.screen === 'battle' ? (net.unsub ? 1.2 : 0.09) : 0.28;
    if (net.inAcc > step) { net.inAcc = 0; pollOnline(); }
  }
  if (net.role === 'guest' && S.screen === 'battle' && net.code) {
    net.inSend = (net.inSend || 0) + dt;
    const sig = (keys.KeyA || keys.ArrowLeft ? 'L' : '') + (keys.KeyD || keys.ArrowRight ? 'R' : '') + (keys.Space || keys.ArrowUp ? 'J' : '') + (mouse.l ? 'M' : '') + (mouse.r ? 'N' : '') + (keys.KeyF ? 'F' : '') + (keys.KeyQ ? 'Q' : '') + (keys.KeyE ? 'E' : '') + (keys.ShiftLeft || keys.ShiftRight ? 'S' : '');
    if (net.inSend > 0.032 || sig !== net.inSig) {
      net.inSend = 0;
      net.inSig = sig;
      sendInput(camera());
    }
  }
  prevK.Space = keys.Space;
  try { ear(); } catch (e) {}
  try { tickMusic(); } catch (e) {}
}

window.G = {get fighters(){return fighters;}, get game(){return game;}, get acct(){return acct;}, hurt, startDuel, startTeam, DB};
initAuth();
requestAnimationFrame(loop);
})();
</script>
